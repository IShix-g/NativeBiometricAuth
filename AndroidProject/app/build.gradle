plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace "com.ishix.nativebiometricauth"
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.biometric
    compileOnly files("/Applications/Unity/Hub/Editor/6000.0.65f1/PlaybackEngines/AndroidPlayer/Variations/mono/Release/Classes/classes.jar")
}
